[project]
name = "voofacil"
version = "0.1.0"
description = "Bot pessoal de monitoramento de preços de passagens aéreas com alertas por Telegram/e-mail"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "streamlit>=1.35",
    "plotly>=5.20",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voofacil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
