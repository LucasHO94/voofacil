name: VooFacil Worker (varredura periodica)

# Roda a varredura do VooFacil na nuvem, sem depender do PC do usuario.
#
# Modelo (agendamento dinamico via banco, ver voofacil/engine/agendamento.py):
# o GitHub Actions dispara este workflow a cada 15 minutos, SEMPRE (o cron
# abaixo eh fixo/curto de proposito, nao precisa mudar quando o usuario troca
# os horarios). A cada execucao, o worker roda em modo "--auto"
# (voofacil.worker.job_auto): ele consulta o banco (tabela HorarioAgendado,
# editavel na aba Agendamento do painel Streamlit) e decide sozinho, via
# deve_rodar_agora(), se ha uma varredura e/ou um explore para rodar de
# verdade agora - se nao houver, o job sai rapido sem gastar nenhuma chamada
# de API. Ou seja: mudar os horarios agora eh so mexer no painel, sem tocar
# neste arquivo. O repo eh publico, entao minutos de Actions sao ilimitados
# (sem custo) mesmo rodando a cada 15 min o dia inteiro.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:            # botao "Run workflow" para disparo manual/teste

# Evita duas rodadas simultaneas se uma demorar
concurrency:
  group: voofacil-worker
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar varredura
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          TP_TOKEN:         ${{ secrets.TP_TOKEN }}
          SERPAPI_KEY:      ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:        smtp.gmail.com
          SMTP_PORT:        '587'
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:    ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO:   ${{ secrets.SMTP_USER }}
          PYTHONPATH:       .
        run: python -m voofacil.worker --auto
