name: VooFacil Worker (varredura periodica)

# Roda a varredura do VooFacil na nuvem, sem depender do PC do usuario.
# Horarios em UTC (Brasil = UTC-3), gerados a partir dos mesmos defaults de
# SCAN_HORARIOS/EXPLORE_HORARIO (voofacil/config.py) via
# scripts/gerar_cron_actions.py — rode esse script e cole aqui de novo se
# mudar os horarios no .env/config.py.
on:
  schedule:
    - cron: '0 9 * * *'    # 06:00 BRT -> varredura padrao
    - cron: '30 15 * * *'  # 12:30 BRT -> varredura padrao
    - cron: '0 0 * * *'    # 21:00 BRT -> varredura padrao
    - cron: '0 8 * * *'    # 05:00 BRT -> busca ampla (explore)
  workflow_dispatch:            # botao "Run workflow" para disparo manual/teste

# Evita duas rodadas simultaneas se uma demorar
concurrency:
  group: voofacil-worker
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar varredura
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          TP_TOKEN:         ${{ secrets.TP_TOKEN }}
          SERPAPI_KEY:      ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:        smtp.gmail.com
          SMTP_PORT:        '587'
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:    ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO:   ${{ secrets.SMTP_USER }}
          PYTHONPATH:       .
        run: |
          # github.event.schedule = string do cron que disparou (vazio no manual).
          # O cron da busca ampla roda o explore; os demais (e o disparo manual) fazem a varredura padrao.
          if [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            python -m voofacil.worker --once-explore
          else
            python -m voofacil.worker --once
          fi
